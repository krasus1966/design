    /* ─── tokens · design system: shadcn ────────────────────────────────

    :root {
      /* surface */
      --bg: #ffffff;
      --surface: #ffffff;

      /* foreground ramp */
      --fg: #111827;
      --muted: #64748b;

      /* border */
      --border: #e5e7eb;

      /* accent — shadcn primary is pure black; hover/active lift toward white */
      --accent: #000000;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), white 10%);
      --accent-active: color-mix(in oklab, var(--accent), white 18%);

      /* semantic — state only, never decoration */
      --success: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;

      /* derived surfaces (no hex) */
      --fg-soft: color-mix(in oklab, var(--fg) 6%, transparent);
      --fg-softer: color-mix(in oklab, var(--fg) 3%, transparent);
      --accent-soft: color-mix(in oklab, var(--accent) 10%, transparent);

      /* type */
      --font-display: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
      --font-body: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
      --font-mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 20px;
      --text-xl: 24px;
      --text-2xl: 32px;

      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.02em;

      /* spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;

      /* radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;

      /* elevation */
      --elev-raised:
        0 1px 2px 0 color-mix(in oklab, var(--fg), transparent 92%),
        0 1px 3px 0 color-mix(in oklab, var(--fg), transparent 88%);

      /* focus — the shadcn ring-2 + offset pattern */
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

      /* motion */
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }
