       内容区里的每个功能都是一份独立文档（views/*.html），按需载入 iframe。
       视图之间不共享 document，一切跨文档通信走 OrbitBus。 -->
  <script src="assets/orbit-bus.js"></script>

      <div class="nav-group" data-od-id="nav-group-sysdata" data-menu="sysdata">

          系统数据管理

          <button class="nav-item" data-view="role" data-crumb="角色管理" data-menu="role" data-od-id="nav-role">角色管理</button>

    <div class="side-foot">

        <span>
          <span class="u-name">张思远</span>
          <span class="u-mail">zhang@orbit.io</span>
        </span>
        <button class="icon-btn u-out" type="button" title="退出登录" aria-label="退出登录" style="border:0;background:transparent;width:auto;height:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <nav class="crumb" aria-label="面包屑">
        <span>Orbit 控制台</span>
        <span class="crumb-sep">/</span>
        <span id="crumb">数据概览</span>
      </nav>

      <div class="search" role="search" data-od-id="global-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="global-search" type="search" autocomplete="off"
               placeholder="搜索单据编号或名称，回车跳转" aria-label="全局搜索单据" />
        <kbd>⌘K</kbd>
      </div>

      <button class="icon-btn" type="button" data-theme-toggle data-od-id="theme-toggle" aria-label="切换深浅色主题" title="切换深浅色主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <span class="avatar" aria-hidden="true">ZS</span>
    </header>

    <!-- 内容区：每个功能视图一个 iframe，首次进入时创建，之后靠 hidden 切换，
         视图内部状态（筛选、翻页、选中的部门）因此不会在切页时丢失。 -->
    <div class="content" id="view-host"></div>
  </div>
</div>

<script src="assets/orbit-data.js"></script>
<script>
  (function () {
    "use strict";
    var doc = document;
    var VIEW_KEY = "orbit.view";
    var DEFAULT_VIEW = "overview";

    var navItems = Array.prototype.slice.call(doc.querySelectorAll(".nav-item[data-view]"));
    var navGroups = Array.prototype.slice.call(doc.querySelectorAll(".nav-group"));
    var crumb = doc.getElementById("crumb");
    var host = doc.getElementById("view-host");
    var badge = doc.getElementById("activity-badge");
    var gSearch = doc.getElementById("global-search");

    var frames = {};   /* 视图名 → iframe */
    var lives = {};    /* 视图名 → 是否已发过 ready */
    var queue = {};    /* 视图名 → ready 之前排队的消息 */
    var readAll = false; /* 「全部已读」是否发生过——迟到的视图据此补发 */

    function itemFor(name) {
      for (var i = 0; i < navItems.length; i++) {
        if (navItems[i].getAttribute("data-view") === name) return navItems[i];
      }
      return null;
    }
    function viewExists(name) { return !!itemFor(name); }

    function openGroup(group, open) {
      var parent = group.querySelector(".nav-parent");
      var sub = group.querySelector(".nav-sub");
      if (!parent || !sub) return;
      parent.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) sub.removeAttribute("hidden"); else sub.setAttribute("hidden", "");
    }
    function toggleGroup(group) {
      var parent = group.querySelector(".nav-parent");
      if (!parent) return;
      openGroup(group, parent.getAttribute("aria-expanded") !== "true");
    }
    function setGroupsFor(name) {
      navGroups.forEach(function (group) {
        var has = !!group.querySelector('.nav-item[data-view="' + name + '"]');
        group.classList.toggle("has-active", has);
        if (has) openGroup(group, true);
      });
    }

    function deliver(name, type, payload) {
      var f = frames[name];
      if (!f || !f.contentWindow) return;
      try {
        f.contentWindow.postMessage(
          { __orbit: true, type: type, payload: payload === undefined ? null : payload }, "*"
        );
      } catch (e) {}
    }
    function sendTo(name, type, payload) {
      if (lives[name]) deliver(name, type, payload);
      else (queue[name] || (queue[name] = [])).push([type, payload]);
    }

    function frameFor(name) {
      if (frames[name]) return frames[name];
      var item = itemFor(name);
      var f = doc.createElement("iframe");
      f.className = "view-frame";
      /* 主题走 URL 片段：视图文档在首次绘制前就能读到，深色下不闪白。 */
      f.setAttribute("src", "views/" + name + ".html#theme=" + OrbitBus.currentTheme());
      f.setAttribute("title", item ? (item.getAttribute("data-crumb") || name) : name);
      f.hidden = true;
      host.appendChild(f);
      frames[name] = f;
      return f;
    }

    function reachable(name) {
      var item = itemFor(name);
      return !!item && !item.hidden;
    }

    function setView(name, persist) {
      if (!viewExists(name) || !reachable(name)) name = DEFAULT_VIEW;
      Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== name; });
      frameFor(name).hidden = false;

      var activeCrumb = null;
      navItems.forEach(function (item) {
        var on = item.getAttribute("data-view") === name;
        item.classList.toggle("is-active", on);
        if (on) {
          item.setAttribute("aria-current", "page");
          activeCrumb = item.getAttribute("data-crumb") || item.textContent.trim();
        } else {
          item.removeAttribute("aria-current");
        }
      });
      if (crumb && activeCrumb) crumb.textContent = activeCrumb;
      setGroupsFor(name);

      if (persist) {
        try { localStorage.setItem(VIEW_KEY, name); } catch (e) {}
      }
    }

    /* 把菜单启停落到真实的侧栏节点上；当前入口被停用时退到第一个可见入口，
       这样"默认入口"永远在，不会把所有菜单关掉之后无处可去。 */
    function applyMenuVisibility() {
      Array.prototype.slice.call(doc.querySelectorAll("[data-menu]")).forEach(function (el) {
        el.hidden = !OrbitData.menuEnabled(el.getAttribute("data-menu"));
      });
      var active = navItems.filter(function (i) { return i.classList.contains("is-active"); })[0];
      if (active && !OrbitData.menuEnabled(active.getAttribute("data-menu"))) {
        var fallback = DEFAULT_VIEW;
        for (var i = 0; i < navItems.length; i++) {
          if (OrbitData.menuEnabled(navItems[i].getAttribute("data-menu"))) {
            fallback = navItems[i].getAttribute("data-view");
            break;
          }
        }
        setView(fallback, true);
      }
    }

    function setUnread(n) {
      if (!badge) return;
      badge.textContent = String(n);
      badge.style.display = n ? "" : "none";
    }

    /* ---------- 来自各功能视图的消息 ---------- */
    OrbitBus.on("ready", function (name) {
      lives[name] = true;
      (queue[name] || []).forEach(function (m) { deliver(name, m[0], m[1]); });
      queue[name] = [];
      /* 权威状态：菜单启停与账号状态以统一入口持有的那份为准。
         视图各自载入一份 orbit-data.js，全靠这一步对齐，
         否则「成员管理」和「用户管理」会各说各话。 */
      deliver(name, "menus:state", OrbitData.menuStateMap());
      deliver(name, "accounts:state", OrbitData.accountStateMap());
      if (readAll) deliver(name, "read:all");
    });

    OrbitBus.on("nav", function (name) { setView(name, true); });

    OrbitBus.on("badge", function (n) { setUnread(n); });

    OrbitBus.on("read:all", function () {
      readAll = true;
      setUnread(0);
      OrbitBus.broadcast("read:all");
    });

    OrbitBus.on("account", function (p) {
      if (!p) return;
      OrbitData.setAccountStatus(p.login, p.status);
      OrbitBus.broadcast("account", p);
    });

    OrbitBus.on("menu", function (p) {
      if (!p) return;
      OrbitData.setMenuOn(p.code, p.on);
      applyMenuVisibility();
    });

    /* ---------- 外壳自身的交互 ---------- */
    navItems.forEach(function (item) {
      item.addEventListener("click", function () { setView(item.getAttribute("data-view"), true); });
    });

    navGroups.forEach(function (group) {
      var parent = group.querySelector(".nav-parent");
      if (parent) parent.addEventListener("click", function () { toggleGroup(group); });
    });

    Array.prototype.slice.call(doc.querySelectorAll("[data-theme-toggle]")).forEach(function (btn) {
      btn.addEventListener("click", function () {
        var next = OrbitBus.currentTheme() === "dark" ? "light" : "dark";
        OrbitBus.setTheme(next);
        /* 已经载入的视图即时换色，之后新建的视图从 URL 片段拿。 */
        OrbitBus.broadcast("theme", next);
      });
    });

    doc.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        if (gSearch) { gSearch.focus(); gSearch.select(); }
      }
    });

    /* 全局搜索：回车跳到「数据表格」并把关键词带过去。
       视图还没载入就排队，ready 之后投递。 */
    if (gSearch) {
      gSearch.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        var q = gSearch.value.trim();
        if (!q) return;
        frameFor("table");
        setView("table", true);
        sendTo("table", "search", q);
      });
    }

    /* ---------- Boot ----------
       未读徽标的初值就是侧栏标记里写着的那个数——只有「动态通知」视图
       能数清自己的未读条目，它在就绪后会回报真实值。这里不猜。 */
    var saved = null;
    try { saved = localStorage.getItem(VIEW_KEY); } catch (e) { saved = null; }
    setView(saved || DEFAULT_VIEW, false);
    applyMenuVisibility();
  })();
</script>
</body>
</html>
